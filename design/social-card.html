<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Blinkly share card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111619;color:#eef3f2}
body{font-family:Figtree,Arial,sans-serif;padding:28px}
.card{height:574px;position:relative;border-radius:30px;padding:1.5px;background:linear-gradient(120deg,#e9bad8a6,#a4dfe26b 54%,#f0dfa88c)}
.inside{height:100%;border-radius:28.5px;background:radial-gradient(ellipse at 14% 50%,#a4dfe20b,transparent 52%),#14191c;display:flex;align-items:center;justify-content:center;gap:66px;padding:58px 70px}
img{width:340px;height:340px;object-fit:contain;flex:none}
.copy{padding-bottom:8px}
h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-size:104px;line-height:1;letter-spacing:-3px;margin:0 0 27px;font-weight:700}
p{font-size:41px;line-height:1.22;letter-spacing:-1px;margin:0;font-weight:400;color:#dce4e5}
.note{position:absolute;left:70px;bottom:28px;right:70px;display:flex;align-items:center;justify-content:space-between;color:#a1aeb1;font-size:19px;letter-spacing:.2px}
.rhythm{font-size:18px;letter-spacing:5px;color:#e9bad8}
</style>
</head>
<body><main class="card"><div class="inside"><img src="../assets/blinkly-logo.png" alt="Blinkly logo"><div class="copy"><h1>Blinkly</h1><p>A small pause<br>for your eyes.</p></div></div><div class="note"><span>Gentle eye care for your browser</span><span class="rhythm">20 · 20 · 20</span></div></main></body>
</html>
